<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Proton Services || Embed Builder</title>
<link rel="icon" href="https://raw.githubusercontent.com/t0x1c-dev/Proton-Services/main/images/proton-services-logo-backgroundtransparent.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#1e1f22;--bg1:#2b2d31;--bg2:#313338;--bg3:#383a40;--hover:#3f4147;--border:#3f4147;--border2:#4e5058;--text:#dbdee1;--muted:#b5bac1;--faint:#949ba4;--accent:#5865f2;--green:#23a559;--green2:#1a7d44;--red:#f23f43;--radius:8px;--font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,input,textarea,label{outline:none}
body{font-family:var(--font);background:var(--bg0);color:var(--text);min-height:100vh;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;height:52px;flex-shrink:0;gap:8px;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.logo img{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.logo-badge{background:var(--accent);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;flex-shrink:0}
.header-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
.nav-toggle{display:none;width:36px;height:36px;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer}
.nav-toggle svg{width:18px;height:18px}
.main{display:grid;grid-template-columns:270px 1fr 380px;flex:1;overflow:hidden;min-height:0}
.sidebar{background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sidebar-section{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-section h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:10px}
.palette{display:grid;grid-template-columns:1fr;gap:6px}
.palette-btn{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:background .12s,border-color .12s}
.palette-btn:hover{background:var(--bg3);border-color:var(--border2)}
.palette-btn svg{width:18px;height:18px;opacity:.9;flex-shrink:0}
.webhook-fields{display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;padding:12px;min-height:0}
.send-bar{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.send-bar .btn{width:100%}
.canvas{background:var(--bg0);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.canvas-header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.canvas-header h2{font-size:13px;font-weight:600;color:var(--muted)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);text-align:center;padding:40px 16px;gap:12px}
.empty-state svg{opacity:.3}
.empty-state p{max-width:260px;font-size:13px;line-height:1.5}
.comp{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.comp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--border);user-select:none}
.comp-icon{width:16px;height:16px;flex-shrink:0;opacity:.85}
.comp-title{font-weight:600;font-size:13px;flex:1;min-width:0}
.comp-type{font-size:10px;color:var(--faint);background:var(--bg0);padding:2px 5px;border-radius:4px;flex-shrink:0}
.comp-actions{display:flex;gap:2px;flex-shrink:0}
.icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:4px;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.danger:hover{background:rgba(242,63,67,.15);color:var(--red)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.icon-btn svg{width:14px;height:14px}
.comp-body{padding:12px;display:flex;flex-direction:column;gap:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
input[type=text],input[type=url],textarea{width:100%;background:var(--bg0);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:72px;resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle-row span{font-size:13px;color:var(--muted)}
.toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--bg3);border-radius:26px;transition:.2s}
.toggle-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
.color-wrap{display:flex;align-items:center;gap:8px}
.color-swatch{width:36px;height:32px;border-radius:6px;border:2px solid var(--border);cursor:pointer;flex-shrink:0}
.pick-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg0);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit;cursor:pointer;text-align:left}
.pick-btn:hover{border-color:var(--border2)}
.pick-btn svg{width:14px;height:14px;opacity:.7;flex-shrink:0}
.modal-backdrop{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5)}
.modal-backdrop.open{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:410;background:var(--bg1);border:1px solid var(--border);border-radius:12px;padding:16px;width:min(320px,calc(100vw - 32px));box-shadow:0 16px 48px rgba(0,0,0,.55);max-height:80vh;overflow-y:auto}
.modal h4{font-size:14px;font-weight:600;color:#fff;margin-bottom:12px}
.modal-options{display:flex;flex-direction:column;gap:4px}
.modal-opt{padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:center;justify-content:space-between;border:1px solid transparent}
.modal-opt:hover{background:var(--bg3)}
.modal-opt.active{background:rgba(88,101,242,.15);border-color:rgba(88,101,242,.35);color:#c4cafc}
.modal-opt .check{width:16px;height:16px;opacity:0}
.modal-opt.active .check{opacity:1;color:var(--accent)}
.modal-close{margin-top:12px;width:100%}
.cp-sv{position:relative;width:100%;aspect-ratio:1.4;border-radius:8px;cursor:crosshair;overflow:hidden;touch-action:none}
.cp-sv-white{position:absolute;inset:0;background:linear-gradient(to right,#fff,transparent)}
.cp-sv-black{position:absolute;inset:0;background:linear-gradient(to top,#000,transparent)}
.cp-sv-cursor{position:absolute;width:16px;height:16px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.cp-hue{position:relative;width:100%;height:16px;border-radius:8px;margin-top:14px;cursor:pointer;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);touch-action:none}
.cp-hue-cursor{position:absolute;top:50%;width:18px;height:18px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none;background:currentColor}
.cp-hex-row{display:flex;gap:8px;margin-top:14px;align-items:center}
.cp-hex-row input{flex:1;font-family:var(--mono);font-size:13px}
.cp-preview{width:36px;height:36px;border-radius:8px;border:2px solid var(--border);flex-shrink:0}
.cp-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.cp-preset{aspect-ratio:1;border-radius:5px;border:2px solid transparent;cursor:pointer}
.cp-preset:hover{border-color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:6px;border:none;font-weight:500;font-size:13px;cursor:pointer;font-family:inherit;transition:background .12s,transform .08s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:var(--green2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg2);color:var(--text)}
.btn-sm{padding:6px 10px;font-size:12px}
.media-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.media-row input[type=file]{display:none}
.file-btn{padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.file-btn:hover{background:var(--bg3);color:var(--text)}
.opt-card{border:1px solid var(--border);border-radius:6px;padding:10px;background:var(--bg0);margin-bottom:8px}
.section-label{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.preview-pane{background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.preview-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.preview-tab{flex:1;padding:12px;text-align:center;font-size:12px;font-weight:600;color:var(--faint);background:transparent;border:none;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent}
.preview-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.preview-body{flex:1;overflow-y:auto;padding:16px;min-height:0;background:#313338}
.discord-msg{display:flex;gap:14px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.msg-author{font-weight:500;color:#fff;font-size:15px}
.msg-bot{background:var(--accent);color:#fff;font-size:10px;font-weight:600;padding:1px 4px;border-radius:3px;text-transform:uppercase}
.msg-time{font-size:12px;color:var(--faint)}
.msg-content{color:var(--text);font-size:15px;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;line-height:1.375}
.embed{background:#2b2d31;border-left:4px solid #202225;border-radius:4px;padding:8px 12px 12px;margin-top:4px;max-width:520px;display:grid;grid-template-columns:1fr auto;gap:8px 12px}
.embed-main{min-width:0}
.embed-author{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:14px;font-weight:500;color:#fff}
.embed-author img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.embed-author a{color:#fff;text-decoration:none}
.embed-author a:hover{text-decoration:underline}
.embed-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:4px;line-height:1.25}
.embed-title a{color:#00a8fc;text-decoration:none}
.embed-title a:hover{text-decoration:underline}
.embed-desc{font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-word;line-height:1.375;margin-bottom:8px}
.embed-desc strong{font-weight:700}.embed-desc em{font-style:italic}
.embed-desc code{background:#1e1f22;padding:2px 5px;border-radius:4px;font-family:var(--mono);font-size:.88em}
.embed-desc pre{background:#1e1f22;border-radius:6px;padding:12px;overflow-x:auto;margin:8px 0;font-family:var(--mono);font-size:13px;border:1px solid #3f4147}
.embed-desc pre code{background:none;padding:0}
.embed-desc a{color:#00a8fc;text-decoration:none}
.embed-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.embed-field{min-width:0}
.embed-field.full{grid-column:1/-1}
.embed-field-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px}
.embed-field-value{font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.embed-image{max-width:100%;border-radius:4px;margin-top:8px;display:block}
.embed-thumb{width:80px;height:80px;border-radius:4px;object-fit:cover;grid-row:1/span 10;align-self:start}
.embed-footer{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin-top:8px}
.embed-footer img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.json-view{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-all;background:var(--bg0);border-radius:6px;padding:12px;border:1px solid var(--border)}
.json-key{color:#9cdcfe}.json-string{color:#ce9178}.json-number{color:#b5cea8}.json-bool,.json-null{color:#569cd6}
.toast-stack{position:fixed;top:16px;right:16px;z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(360px,calc(100vw - 32px))}
.toast{pointer-events:auto;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;align-items:flex-start;gap:10px;animation:toastIn .25s ease;font-size:13px;font-weight:500}
.toast.ok{border-color:rgba(35,165,89,.5)}
.toast.err{border-color:rgba(242,63,67,.5)}
.toast-icon{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.toast.ok .toast-icon{color:var(--green)}
.toast.err .toast-icon{color:var(--red)}
.toast-body{flex:1;min-width:0;line-height:1.4;color:var(--text)}
.toast-close{background:transparent;border:none;color:var(--faint);cursor:pointer;padding:2px;border-radius:4px;flex-shrink:0}
.toast-close:hover{color:var(--text);background:var(--hover)}
.toast-close svg{width:16px;height:16px;display:block}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.mobile-bar{display:none;background:var(--bg1);border-top:1px solid var(--border);padding:8px 12px;gap:8px;flex-shrink:0;z-index:90}
.mobile-bar .btn{flex:1}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150}
.drawer-backdrop.open{display:block}
#jsonFileInput,#imgFileInput{display:none}
@media(max-width:900px){
.nav-toggle{display:flex}
.main{grid-template-columns:1fr}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);z-index:200;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.sidebar.open{transform:translateX(0)}
.preview-pane{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);z-index:200;transform:translateX(100%);transition:transform .22s ease;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.preview-pane.open{transform:translateX(0)}
.canvas{padding:14px 12px 80px}
.mobile-bar{display:flex}
.header-actions .btn span{display:none}
}
@media(max-width:480px){.field-row{grid-template-columns:1fr}.logo-badge{display:none}.embed-fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
<button class="nav-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div class="logo">
<img src="https://raw.githubusercontent.com/t0x1c-dev/Proton-Services/main/images/proton-services-logo-backgroundtransparent.png" alt="Proton">
<span>Proton Services</span>
<span class="logo-badge">EMBED FREE</span>
</div>
<div class="header-actions">
<button class="btn btn-ghost btn-sm" onclick="loadExample()" title="Load example"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8h6.1l-4.9 3.6 1.9 5.8L12 14.6l-4.9 3.6 1.9-5.8-4.9-3.6h6.1L12 3z"/></svg><span>Example</span></button>
<button class="btn btn-ghost btn-sm" onclick="downloadJSON()" title="Export JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span>Export</span></button>
<button class="btn btn-ghost btn-sm" onclick="document.getElementById('jsonFileInput').click()" title="Import JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg><span>Import</span></button>
<button class="btn btn-ghost btn-sm" onclick="togglePreview()" title="Preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span>Preview</span></button>
</div>
</header>
<input type="file" id="jsonFileInput" accept=".json,application/json" onchange="importJSON(this)">
<div class="drawer-backdrop" id="backdrop" onclick="closeDrawers()"></div>
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div>
<div class="modal" id="pickerModal" style="display:none"></div>
<div class="main">
<aside class="sidebar" id="sidebar">
<div class="sidebar-section">
<h3>Add Embed</h3>
<div class="palette">
<button class="palette-btn" onclick="addEmbed();closeDrawers()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 14h6"/></svg>New Embed</button>
</div>
</div>
<div class="webhook-fields">
<div class="field"><label>Webhook URL</label><input type="url" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..."></div>
<div class="field"><label>Username</label><input type="text" id="username" placeholder="Optional" oninput="refreshPreview()"></div>
<div class="field"><label>Avatar URL</label><input type="url" id="avatarUrl" placeholder="Optional" oninput="refreshPreview()"></div>
<div class="field"><label>Message Content</label><textarea id="msgContent" placeholder="Text above embeds (optional)" oninput="refreshPreview()"></textarea></div>
</div>
<div class="send-bar"><button class="btn btn-success" onclick="sendWebhook()" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>Send Message</button></div>
</aside>
<main class="canvas" id="canvas">
<div class="canvas-header"><h2>Embeds</h2><div style="display:flex;gap:8px;align-items:center"><span style="font-size:12px;color:var(--faint)" id="embedCount">0 embeds</span><button class="btn btn-ghost btn-sm" onclick="clearAll()">Clear</button></div></div>
<div id="embedList"></div>
</main>
<aside class="preview-pane" id="previewPane">
<div class="preview-tabs">
<button class="preview-tab active" data-tab="preview" onclick="switchTab('preview')">Preview</button>
<button class="preview-tab" data-tab="json" onclick="switchTab('json')">JSON</button>
</div>
<div class="preview-body" id="previewBody"></div>
</aside>
</div>
<div class="mobile-bar">
<button class="btn btn-ghost" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>Add</button>
<button class="btn btn-ghost" onclick="togglePreview()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Preview</button>
<button class="btn btn-success" onclick="sendWebhook()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>Send</button>
</div>
</div>
<div class="toast-stack" id="toastStack"></div>
<script>
const I={embed:'<svg class="comp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 14h6"/></svg>',up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>',down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M12 5v14M5 12h14"/></svg>',chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',check:'<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>',ok:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',err:'<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>'};
const PRESETS=['#5865f2','#57F287','#FEE75C','#EB459E','#ED4245','#FFFFFF','#000000','#3498db','#9b59b6','#e67e22','#1abc9c','#95a5a6'];
let embeds=[],nextId=1,activeTab='preview',cpTargetId=null,cpH=0,cpS=1,cpV=1,imgTarget=null;
function uid(){return nextId++}
function toast(msg,type){type=type||'ok';const stack=document.getElementById('toastStack');const el=document.createElement('div');el.className='toast '+type;el.innerHTML=`${type==='err'?I.err:I.ok}<div class="toast-body">${esc(msg)}</div><button class="toast-close" aria-label="Close">${I.x}</button>`;el.querySelector('.toast-close').onclick=()=>el.remove();stack.appendChild(el);setTimeout(()=>{if(el.parentNode)el.remove()},4000)}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function md(t){if(!t)return'';let h=esc(t);h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre><code>'+c.trim()+'</code></pre>');h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');h=h.replace(/\n/g,'<br>');return h}
function hsvToRgb(h,s,v){h/=60;const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break}return[Math.round(r*255),Math.round(g*255),Math.round(b*255)]}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;const s=max===0?0:d/max,v=max;if(d){switch(max){case r:h=((g-b)/d+(g<b?6:0));break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break}h*=60}return[h,s,v]}
function hexFromHsv(h,s,v){const[r,g,b]=hsvToRgb(h,s,v);return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function hsvFromHex(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return rgbToHsv((n>>16)&255,(n>>8)&255,n&255)}
function openModal(html){document.getElementById('modalBackdrop').classList.add('open');const m=document.getElementById('pickerModal');m.style.display='block';m.innerHTML=html}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('pickerModal').style.display='none';if(cpTargetId!=null){cpTargetId=null;render()}}
function updateCpUI(){const hex=hexFromHsv(cpH,cpS,cpV);const[r,g,b]=hsvToRgb(cpH,1,1);const sv=document.getElementById('cpSv');if(!sv)return;sv.style.background=`rgb(${r},${g},${b})`;document.getElementById('cpSvCursor').style.left=(cpS*100)+'%';document.getElementById('cpSvCursor').style.top=((1-cpV)*100)+'%';document.getElementById('cpHueCursor').style.left=(cpH/360*100)+'%';document.getElementById('cpHueCursor').style.color=hexFromHsv(cpH,1,1);document.getElementById('cpPreview').style.background=hex;document.getElementById('cpHex').value=hex;if(cpTargetId!=null){const e=embeds.find(x=>x.id===cpTargetId);if(e){e.color=parseInt(hex.slice(1),16);const sw=document.querySelector('[data-swatch="'+cpTargetId+'"]');if(sw)sw.style.background=hex;const inp=document.querySelector('[data-hex="'+cpTargetId+'"]');if(inp)inp.value=hex;refreshPreview()}}}
function openColorPicker(id,hex){cpTargetId=id;const hsv=hsvFromHex(hex||'#5865f2');cpH=hsv[0];cpS=hsv[1];cpV=hsv[2];openModal(`<h4>Embed Color</h4><div class="cp-sv" id="cpSv"><div class="cp-sv-white"></div><div class="cp-sv-black"></div><div class="cp-sv-cursor" id="cpSvCursor"></div></div><div class="cp-hue" id="cpHue"><div class="cp-hue-cursor" id="cpHueCursor"></div></div><div class="cp-hex-row"><div class="cp-preview" id="cpPreview"></div><input type="text" id="cpHex" maxlength="7" onchange="applyHex(this.value)"></div><div class="cp-presets">${PRESETS.map(p=>`<div class="cp-preset" style="background:${p}" onclick="applyHex('${p}')"></div>`).join('')}</div><button class="btn btn-ghost modal-close" onclick="closeModal()">Done</button>`);updateCpUI();bindColorDrag()}
function applyHex(hex){if(!hex.startsWith('#'))hex='#'+hex;if(!/^#[0-9A-Fa-f]{6}$/.test(hex))return;const hsv=hsvFromHex(hex);cpH=hsv[0];cpS=hsv[1];cpV=hsv[2];updateCpUI()}
function bindColorDrag(){const sv=document.getElementById('cpSv'),hue=document.getElementById('cpHue');if(!sv||!hue)return;function svM(e){const r=sv.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;cpS=Math.max(0,Math.min(1,x/r.width));cpV=Math.max(0,Math.min(1,1-y/r.height));updateCpUI()}function hueM(e){const r=hue.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;cpH=Math.max(0,Math.min(360,x/r.width*360));updateCpUI()}let sd=false,hd=false;const up=()=>{sd=false;hd=false};sv.onmousedown=e=>{sd=true;svM(e)};hue.onmousedown=e=>{hd=true;hueM(e)};window.onmousemove=e=>{if(sd)svM(e);if(hd)hueM(e)};window.onmouseup=up;sv.ontouchstart=e=>{sd=true;svM(e)};hue.ontouchstart=e=>{hd=true;hueM(e)};window.ontouchmove=e=>{if(sd)svM(e);if(hd)hueM(e)};window.ontouchend=up}
function toggleSidebar(){const sb=document.getElementById('sidebar'),pv=document.getElementById('previewPane'),bd=document.getElementById('backdrop');pv.classList.remove('open');sb.classList.toggle('open');bd.classList.toggle('open',sb.classList.contains('open'))}
function togglePreview(){const sb=document.getElementById('sidebar'),pv=document.getElementById('previewPane'),bd=document.getElementById('backdrop');sb.classList.remove('open');pv.classList.toggle('open');bd.classList.toggle('open',pv.classList.contains('open'));refreshPreview()}
function closeDrawers(){document.getElementById('sidebar').classList.remove('open');document.getElementById('previewPane').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}
function blankEmbed(){return{id:uid(),title:'',description:'',url:'',color:0x5865f2,useColor:true,author:{name:'',url:'',icon_url:''},footer:{text:'',icon_url:''},thumbnail:'',image:'',timestamp:false,fields:[]}}
function addEmbed(){if(embeds.length>=10){toast('Max 10 embeds per message','err');return}embeds.push(blankEmbed());render();refreshPreview()}
function removeEmbed(id){embeds=embeds.filter(e=>e.id!==id);render();refreshPreview()}
function moveEmbed(id,dir){const idx=embeds.findIndex(e=>e.id===id);if(idx<0)return;const ni=idx+dir;if(ni<0||ni>=embeds.length)return;[embeds[idx],embeds[ni]]=[embeds[ni],embeds[idx]];render();refreshPreview()}
function setEmbed(id,key,val){const e=embeds.find(x=>x.id===id);if(!e)return;if(key.includes('.')){const[a,b]=key.split('.');if(!e[a])e[a]={};e[a][b]=val}else e[key]=val;if(key==='useColor')render();refreshPreview()}
function addField(id){const e=embeds.find(x=>x.id===id);if(!e)return;if(e.fields.length>=25){toast('Max 25 fields','err');return}e.fields.push({name:'',value:'',inline:false});render();refreshPreview()}
function removeField(id,idx){const e=embeds.find(x=>x.id===id);if(!e)return;e.fields.splice(idx,1);render();refreshPreview()}
function setField(id,idx,key,val){const e=embeds.find(x=>x.id===id);if(!e||!e.fields[idx])return;e.fields[idx][key]=val;refreshPreview()}
function handleImageUpload(embedId,field,input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Images only','err');return}const reader=new FileReader();reader.onload=()=>{const e=embeds.find(x=>x.id===embedId);if(!e)return;if(field==='thumbnail')e.thumbnail=reader.result;else if(field==='image')e.image=reader.result;else if(field==='author')e.author.icon_url=reader.result;else if(field==='footer')e.footer.icon_url=reader.result;render();refreshPreview();toast('Image added (preview)');input.value=''};reader.readAsDataURL(file)}
function renderEmbed(e,index,total){
const hex='#'+(e.color||0x5865f2).toString(16).padStart(6,'0');
const head=`<div class="comp-head">${I.embed}<span class="comp-title">Embed ${index+1}</span><span class="comp-type">${e.title?esc(e.title.slice(0,24)):'Untitled'}</span><div class="comp-actions"><button class="icon-btn" onclick="moveEmbed(${e.id},-1)" ${index===0?'disabled':''}>${I.up}</button><button class="icon-btn" onclick="moveEmbed(${e.id},1)" ${index===total-1?'disabled':''}>${I.down}</button><button class="icon-btn danger" onclick="removeEmbed(${e.id})">${I.trash}</button></div></div>`;
let body=`<div class="field-row"><div class="field"><label>Title</label><input type="text" value="${esc(e.title)}" maxlength="256" oninput="setEmbed(${e.id},'title',this.value)"></div><div class="field"><label>Title URL</label><input type="url" value="${esc(e.url)}" oninput="setEmbed(${e.id},'url',this.value)"></div></div>`;
body+=`<div class="field"><label>Description</label><textarea maxlength="4096" oninput="setEmbed(${e.id},'description',this.value)">${esc(e.description)}</textarea></div>`;
body+=`<div class="toggle-row"><span>Color</span><label class="toggle"><input type="checkbox" ${e.useColor?'checked':''} onchange="setEmbed(${e.id},'useColor',this.checked)"><span class="toggle-slider"></span></label></div>`;
if(e.useColor)body+=`<div class="field"><label>Accent</label><div class="color-wrap"><div class="color-swatch" data-swatch="${e.id}" style="background:${hex}" onclick="openColorPicker(${e.id},'${hex}')"></div><input type="text" data-hex="${e.id}" value="${hex}" style="flex:1" onchange="applyHex(this.value);if(cpTargetId===${e.id})updateCpUI();else{const x=embeds.find(z=>z.id===${e.id});if(x){x.color=parseInt(this.value.replace('#',''),16);render();refreshPreview()}}"></div></div>`;
body+=`<div class="section-label">Author</div><div class="field-row"><div class="field"><label>Name</label><input type="text" value="${esc(e.author.name)}" maxlength="256" oninput="setEmbed(${e.id},'author.name',this.value)"></div><div class="field"><label>URL</label><input type="url" value="${esc(e.author.url)}" oninput="setEmbed(${e.id},'author.url',this.value)"></div></div><div class="field"><label>Icon URL</label><input type="url" value="${esc(e.author.icon_url&&!String(e.author.icon_url).startsWith('data:')?e.author.icon_url:'')}" oninput="setEmbed(${e.id},'author.icon_url',this.value)"><div class="media-row" style="margin-top:6px"><label class="file-btn">Upload<input type="file" accept="image/*" onchange="handleImageUpload(${e.id},'author',this)"></label></div></div>`;
body+=`<div class="section-label">Media</div><div class="field"><label>Thumbnail URL</label><input type="url" value="${esc(e.thumbnail&&!String(e.thumbnail).startsWith('data:')?e.thumbnail:'')}" oninput="setEmbed(${e.id},'thumbnail',this.value)"><div class="media-row" style="margin-top:6px"><label class="file-btn">Upload<input type="file" accept="image/*" onchange="handleImageUpload(${e.id},'thumbnail',this)"></label></div></div><div class="field"><label>Image URL</label><input type="url" value="${esc(e.image&&!String(e.image).startsWith('data:')?e.image:'')}" oninput="setEmbed(${e.id},'image',this.value)"><div class="media-row" style="margin-top:6px"><label class="file-btn">Upload<input type="file" accept="image/*" onchange="handleImageUpload(${e.id},'image',this)"></label></div></div>`;
body+=`<div class="section-label">Footer</div><div class="field"><label>Text</label><input type="text" value="${esc(e.footer.text)}" maxlength="2048" oninput="setEmbed(${e.id},'footer.text',this.value)"></div><div class="field"><label>Icon URL</label><input type="url" value="${esc(e.footer.icon_url&&!String(e.footer.icon_url).startsWith('data:')?e.footer.icon_url:'')}" oninput="setEmbed(${e.id},'footer.icon_url',this.value)"><div class="media-row" style="margin-top:6px"><label class="file-btn">Upload<input type="file" accept="image/*" onchange="handleImageUpload(${e.id},'footer',this)"></label></div></div>`;
body+=`<div class="toggle-row"><span>Timestamp (now)</span><label class="toggle"><input type="checkbox" ${e.timestamp?'checked':''} onchange="setEmbed(${e.id},'timestamp',this.checked)"><span class="toggle-slider"></span></label></div>`;
const fieldsHtml=e.fields.map((f,i)=>`<div class="opt-card"><div class="field-row"><div class="field"><label>Name</label><input type="text" value="${esc(f.name)}" maxlength="256" oninput="setField(${e.id},${i},'name',this.value)"></div><div class="field"><label>Value</label><input type="text" value="${esc(f.value)}" maxlength="1024" oninput="setField(${e.id},${i},'value',this.value)"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div class="toggle-row"><span>Inline</span><label class="toggle"><input type="checkbox" ${f.inline?'checked':''} onchange="setField(${e.id},${i},'inline',this.checked)"><span class="toggle-slider"></span></label></div><button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="removeField(${e.id},${i})">Remove</button></div></div>`).join('');
body+=`<div class="section-label">Fields (${e.fields.length}/25)</div>${fieldsHtml}<button class="btn btn-ghost btn-sm" onclick="addField(${e.id})">${I.plus} Add Field</button>`;
return`<div class="comp">${head}<div class="comp-body">${body}</div></div>`;
}
function render(){const list=document.getElementById('embedList');document.getElementById('embedCount').textContent=embeds.length+' embed'+(embeds.length!==1?'s':'');if(!embeds.length){list.innerHTML='<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 14h6"/></svg><p>Add embeds from the left. You can create up to 10.</p></div>';return}list.innerHTML=embeds.map((e,i)=>renderEmbed(e,i,embeds.length)).join('')}
function toApiEmbed(e){const o={};if(e.title)o.title=e.title;if(e.description)o.description=e.description;if(e.url)o.url=e.url;if(e.useColor&&e.color!=null)o.color=e.color;if(e.author&&e.author.name){o.author={name:e.author.name};if(e.author.url)o.author.url=e.author.url;if(e.author.icon_url&&!String(e.author.icon_url).startsWith('data:'))o.author.icon_url=e.author.icon_url}if(e.footer&&e.footer.text){o.footer={text:e.footer.text};if(e.footer.icon_url&&!String(e.footer.icon_url).startsWith('data:'))o.footer.icon_url=e.footer.icon_url}if(e.thumbnail&&!String(e.thumbnail).startsWith('data:'))o.thumbnail={url:e.thumbnail};if(e.image&&!String(e.image).startsWith('data:'))o.image={url:e.image};if(e.timestamp)o.timestamp=new Date().toISOString();if(e.fields&&e.fields.length)o.fields=e.fields.filter(f=>f.name||f.value).map(f=>({name:f.name||'\u200b',value:f.value||'\u200b',inline:!!f.inline}));return o}
function buildPayload(){const payload={embeds:embeds.map(toApiEmbed).filter(e=>Object.keys(e).length)};const content=document.getElementById('msgContent').value.trim();if(content)payload.content=content;const u=document.getElementById('username').value.trim();const a=document.getElementById('avatarUrl').value.trim();if(u)payload.username=u;if(a)payload.avatar_url=a;return payload}
function fromApiEmbed(raw){const e=blankEmbed();if(raw.title)e.title=raw.title;if(raw.description)e.description=raw.description;if(raw.url)e.url=raw.url;if(raw.color!=null){e.useColor=true;e.color=raw.color}else e.useColor=false;if(raw.author){e.author.name=raw.author.name||'';e.author.url=raw.author.url||'';e.author.icon_url=raw.author.icon_url||''}if(raw.footer){e.footer.text=raw.footer.text||'';e.footer.icon_url=raw.footer.icon_url||''}if(raw.thumbnail?.url)e.thumbnail=raw.thumbnail.url;if(raw.image?.url)e.image=raw.image.url;if(raw.timestamp)e.timestamp=true;if(raw.fields)e.fields=raw.fields.map(f=>({name:f.name||'',value:f.value||'',inline:!!f.inline}));return e}
function importJSON(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);let list=data.embeds||(Array.isArray(data)?data:null);if(!list){toast('Invalid JSON structure','err');return}embeds=list.slice(0,10).map(fromApiEmbed);if(data.content)document.getElementById('msgContent').value=data.content;if(data.username)document.getElementById('username').value=data.username;if(data.avatar_url)document.getElementById('avatarUrl').value=data.avatar_url;render();refreshPreview();toast('JSON imported')}catch(err){toast('Failed to parse JSON','err')}input.value=''};reader.readAsText(file)}
function downloadJSON(){const blob=new Blob([JSON.stringify(buildPayload(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='embeds.json';a.click();URL.revokeObjectURL(a.href);toast('JSON downloaded')}
function switchTab(tab){activeTab=tab;document.querySelectorAll('.preview-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));refreshPreview()}
function syntaxHighlight(json){return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,m=>{let cls='json-number';if(/^"/.test(m))cls=/:$/.test(m)?'json-key':'json-string';else if(/true|false/.test(m))cls='json-bool';else if(/null/.test(m))cls='json-null';return`<span class="${cls}">${m}</span>`})}
function renderPreviewEmbed(e){const color=e.useColor&&e.color!=null?'#'+Number(e.color).toString(16).padStart(6,'0'):'#202225';let author='';if(e.author&&e.author.name){const icon=e.author.icon_url?`<img src="${esc(e.author.icon_url)}" alt="" onerror="this.style.display='none'">`:'';const name=e.author.url?`<a href="${esc(e.author.url)}" target="_blank">${esc(e.author.name)}</a>`:esc(e.author.name);author=`<div class="embed-author">${icon}<span>${name}</span></div>`}
let title='';if(e.title)title=e.url?`<div class="embed-title"><a href="${esc(e.url)}" target="_blank">${esc(e.title)}</a></div>`:`<div class="embed-title">${esc(e.title)}</div>`;
const desc=e.description?`<div class="embed-desc">${md(e.description)}</div>`:'';let fields='';if(e.fields&&e.fields.length){fields=`<div class="embed-fields">${e.fields.filter(f=>f.name||f.value).map(f=>`<div class="embed-field${f.inline?'':' full'}"><div class="embed-field-name">${esc(f.name||'\u200b')}</div><div class="embed-field-value">${md(f.value||'\u200b')}</div></div>`).join('')}</div>`}
const image=e.image?`<img class="embed-image" src="${esc(e.image)}" alt="" onerror="this.style.display='none'">`:'';const thumb=e.thumbnail?`<img class="embed-thumb" src="${esc(e.thumbnail)}" alt="" onerror="this.style.display='none'">`:'';let footer='';if((e.footer&&e.footer.text)||e.timestamp){const icon=e.footer&&e.footer.icon_url?`<img src="${esc(e.footer.icon_url)}" alt="" onerror="this.style.display='none'">`:'';const text=e.footer?esc(e.footer.text):'';const ts=e.timestamp?' · '+new Date().toLocaleString():'';footer=`<div class="embed-footer">${icon}<span>${text}${ts}</span></div>`}
return`<div class="embed" style="border-left-color:${color}"><div class="embed-main">${author}${title}${desc}${fields}${image}${footer}</div>${thumb}</div>`}
function refreshPreview(){const body=document.getElementById('previewBody');const payload=buildPayload();if(activeTab==='json'){body.innerHTML=`<div class="json-view">${syntaxHighlight(esc(JSON.stringify(payload,null,2)))}</div>`;return}const uname=document.getElementById('username').value.trim()||'Webhook';const avatar=document.getElementById('avatarUrl').value.trim();const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const msgContent=document.getElementById('msgContent').value.trim();let content='';if(msgContent)content+=`<div class="msg-content">${md(msgContent)}</div>`;if(!embeds.length&&!msgContent)content+='<div style="color:var(--faint);padding:24px 0;text-align:center;font-size:13px">Nothing to preview yet</div>';else content+=embeds.map(e=>renderPreviewEmbed(e)).join('');body.innerHTML=`<div class="discord-msg"><div class="avatar">${avatar?`<img src="${esc(avatar)}" onerror="this.parentElement.textContent='${esc(uname[0]||'W')}'">`:esc(uname[0]||'W')}</div><div class="msg-body"><div class="msg-meta"><span class="msg-author">${esc(uname)}</span><span class="msg-bot">BOT</span><span class="msg-time">Today at ${time}</span></div>${content}</div></div>`}
async function sendWebhook(){const url=document.getElementById('webhookUrl').value.trim();if(!url){toast('Paste a webhook URL first','err');return}const payload=buildPayload();if(!payload.embeds?.length&&!payload.content){toast('Add at least one embed or message content','err');return}const btn=document.getElementById('sendBtn');btn.disabled=true;btn.textContent='Sending…';try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(res.ok||res.status===204)toast('Message sent');else{const t=await res.text();toast('Error '+res.status+': '+t.slice(0,90),'err')}}catch(err){toast('Network error: '+err.message,'err')}finally{btn.disabled=false;btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> Send Message'}}
function clearAll(){if(embeds.length&&!confirm('Clear all embeds?'))return;embeds=[];document.getElementById('msgContent').value='';render();refreshPreview()}
function loadExample(){embeds=[{id:uid(),title:'Server Status',description:'All systems operational.\nLatency: **42ms** · Uptime: **99.98%**',url:'https://discord.com',color:0x57F287,useColor:true,author:{name:'Proton Services',url:'',icon_url:'https://cdn.discordapp.com/embed/avatars/0.png'},footer:{text:'Last checked just now',icon_url:''},thumbnail:'',image:'',timestamp:true,fields:[{name:'API',value:'Online',inline:true},{name:'Database',value:'Online',inline:true},{name:'CDN',value:'Online',inline:true}]},{id:uid(),title:'Changelog',description:'- Multi-embed support\n- Advanced color picker\n- Import / Export JSON',color:0x5865f2,useColor:true,author:{name:'',url:'',icon_url:''},footer:{text:'Proton Services',icon_url:''},thumbnail:'',image:'',timestamp:false,fields:[]}];document.getElementById('msgContent').value='';render();refreshPreview();toast('Example loaded');closeDrawers()}
render();refreshPreview();
