<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Proton Services | Components V2 Builder</title>
<link rel="icon" href="https://raw.githubusercontent.com/t0x1c-dev/Proton-Services/main/images/proton-services-logo-backgroundtransparent.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
:root{--bg0:#0c0c0e;--bg1:rgba(18,18,20,.42);--bg2:rgba(26,26,30,.5);--bg3:rgba(34,34,40,.6);--hover:rgba(255,255,255,.06);--border:rgba(42,42,50,.6);--border2:#3a3a44;--text:#f4f4f5;--muted:#a1a1aa;--faint:#71717a;--accent:#5865f2;--green:#22c55e;--green2:#16a34a;--red:#f23f43;--radius:12px;--font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--glass:rgba(18,18,20,.48);--glass-edge:rgba(42,42,50,.65)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,input,textarea,label{outline:none}
body{font-family:var(--font);background:var(--bg0);color:var(--text);min-height:100vh;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:url('https://i.imgur.com/UUw90rV.gif') center center / cover no-repeat;opacity:.65;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
iconify-icon{display:inline-block;vertical-align:middle}
header{background:rgba(12,12,14,.55);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;height:54px;flex-shrink:0;gap:8px;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.logo img{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.header-actions{margin-left:auto;display:flex;gap:0;align-items:center;flex-shrink:0;border-radius:10px;overflow:hidden;border:1px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(12px)}
.header-actions .btn{border:none;border-radius:0;border-right:1px solid var(--glass-edge);background:transparent;padding:8px 11px}
.header-actions .btn:last-child{border-right:none}
.header-actions .btn:hover{background:rgba(255,255,255,.06)}
.nav-toggle{display:none!important}
.main{display:grid;grid-template-columns:280px 1fr 380px;flex:1;overflow:hidden;min-height:0}
.sidebar{background:var(--bg1);backdrop-filter:blur(14px);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sidebar-section{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-section h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:10px}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--glass-edge);background:var(--glass)}
.palette-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 8px;background:transparent;border:none;border-right:1px solid var(--glass-edge);border-bottom:1px solid var(--glass-edge);color:var(--text);cursor:pointer;font-size:11px;font-weight:500;font-family:inherit;transition:background .12s;min-height:68px}
.palette-btn:nth-child(2n){border-right:none}
.palette-btn:nth-last-child(-n+2){border-bottom:none}
.palette-btn:hover{background:rgba(255,255,255,.05)}
.palette-btn iconify-icon{font-size:20px;opacity:.95}
.webhook-fields{display:flex;flex-direction:column;gap:0;flex:1;overflow-y:auto;padding:12px;min-height:0}
.field-stack{border-radius:12px;overflow:hidden;border:1px solid var(--glass-edge);background:var(--glass)}
.field-stack .field{padding:12px;border-bottom:1px solid var(--glass-edge)}
.field-stack .field:last-child{border-bottom:none}
.send-bar{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.send-bar .btn{width:100%}
.canvas{background:transparent;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0;-webkit-overflow-scrolling:touch}
.canvas-header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.canvas-header h2{font-size:13px;font-weight:600;color:var(--muted)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);text-align:center;padding:40px 16px;gap:12px;background:var(--glass);backdrop-filter:blur(12px);border:1px dashed var(--border);border-radius:14px}
.empty-state iconify-icon{font-size:40px;opacity:.35}
.empty-state p{max-width:260px;font-size:13px;line-height:1.5}
.comp-list{display:flex;flex-direction:column;gap:0;border-radius:14px;overflow:visible;border:1px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(12px)}
.comp-list:empty{display:none}
.comp-list > .comp:first-child{border-top-left-radius:14px;border-top-right-radius:14px}
.comp-list > .comp:last-child{border-bottom-left-radius:14px;border-bottom-right-radius:14px}
.comp{background:transparent;border:none;border-bottom:1px solid var(--glass-edge);border-radius:0;overflow:visible}
.comp:last-child{border-bottom:none}
.comp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(0,0,0,.18);border-bottom:1px solid var(--border);user-select:none}
.comp-head iconify-icon{font-size:18px;flex-shrink:0;opacity:.9}
.comp-title{font-weight:600;font-size:13px;flex:1;min-width:0}
.comp-actions{display:flex;gap:2px;flex-shrink:0}
.icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:6px;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.danger:hover{background:rgba(242,63,67,.15);color:var(--red)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.icon-btn iconify-icon{font-size:16px}
.comp-body{padding:12px;display:flex;flex-direction:column;gap:12px}
.children{display:flex;flex-direction:column;gap:0;padding:0;background:rgba(0,0,0,.14);border-radius:10px;border:1px solid var(--border);min-height:44px;overflow:visible}
.children-label{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.child-comp{background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;overflow:visible}
.child-comp:last-child{border-bottom:none}
.child-comp .comp-head{padding:8px 10px;background:rgba(0,0,0,.12)}
.child-comp .comp-body{padding:10px}
.add-child-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.add-child-btn{font-size:11px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.add-child-btn:hover{background:var(--bg3);color:var(--text)}
.add-child-btn iconify-icon{font-size:14px}
label{display:block;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
input[type=text],input[type=url],textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none}
input:focus,textarea:focus{border-color:rgba(255,255,255,.28)}
textarea{min-height:72px;resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle-row span{font-size:13px;color:var(--muted)}
.toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.12);border-radius:26px;transition:.2s}
.toggle-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
.color-wrap{display:flex;align-items:center;gap:8px}
.color-swatch{width:36px;height:32px;border-radius:8px;border:2px solid var(--border);cursor:pointer;flex-shrink:0}
.pick-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit;cursor:pointer;text-align:left}
.pick-btn:hover{border-color:var(--border2)}
.pick-btn iconify-icon{font-size:16px;opacity:.7;flex-shrink:0}
.modal-backdrop{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}
.modal-backdrop.open{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:410;background:rgba(18,18,20,.72);backdrop-filter:blur(24px);border:1px solid var(--glass-edge);border-radius:16px;padding:18px;width:min(340px,calc(100vw - 32px));box-shadow:0 20px 56px rgba(0,0,0,.5);max-height:80vh;overflow-y:auto}
.modal h4{font-size:15px;font-weight:700;color:#fff;margin-bottom:8px}
.modal p.modal-desc{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:14px}
.modal-options{display:flex;flex-direction:column;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--glass-edge)}
.modal-opt{padding:11px 12px;cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glass-edge);background:rgba(0,0,0,.15)}
.modal-opt:last-child{border-bottom:none}
.modal-opt:hover{background:rgba(255,255,255,.06)}
.modal-opt.active{background:rgba(88,101,242,.2);color:#c4cafc}
.modal-opt iconify-icon{font-size:16px;opacity:0}
.modal-opt.active iconify-icon{opacity:1;color:var(--accent)}
.modal-close{margin-top:12px;width:100%}
.cp-sv{position:relative;width:100%;aspect-ratio:1.25;border-radius:12px;cursor:crosshair;overflow:hidden;touch-action:none;border:1px solid var(--border)}
.cp-sv-white{position:absolute;inset:0;background:linear-gradient(to right,#fff,transparent)}
.cp-sv-black{position:absolute;inset:0;background:linear-gradient(to top,#000,transparent)}
.cp-sv-cursor{position:absolute;width:16px;height:16px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.cp-hue{position:relative;width:100%;height:18px;border-radius:9px;margin-top:14px;cursor:pointer;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);touch-action:none;border:1px solid var(--border)}
.cp-hue-cursor{position:absolute;top:50%;width:18px;height:18px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none;background:currentColor}
.cp-hex-row{display:flex;gap:8px;margin-top:14px;align-items:center}
.cp-hex-row input{flex:1;font-family:var(--mono);font-size:13px}
.cp-preview{width:40px;height:40px;border-radius:10px;border:2px solid var(--border);flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:none;font-weight:500;font-size:13px;cursor:pointer;font-family:inherit;transition:background .12s,transform .08s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn iconify-icon{font-size:16px;flex-shrink:0}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:var(--green2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{background:rgba(242,63,67,.9);color:#fff}
.btn-danger:hover{background:#da373c}
.btn-sm{padding:6px 10px;font-size:12px}
.media-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.media-row input[type=file]{display:none}
.file-btn{padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.file-btn:hover{background:var(--bg3);color:var(--text)}
.file-btn iconify-icon{font-size:15px}
.opt-card{border:1px solid var(--border);border-radius:10px;padding:10px;background:rgba(0,0,0,.16);margin-bottom:8px}
.preview-pane{background:var(--bg1);backdrop-filter:blur(14px);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.preview-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(0,0,0,.12)}
.preview-tab{flex:1;padding:12px;text-align:center;font-size:12px;font-weight:600;color:var(--faint);background:transparent;border:none;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent}
.preview-tab.active{color:var(--text);border-bottom-color:#fff}
.preview-body{flex:1;overflow-y:auto;padding:16px;min-height:0;background:rgba(18,18,20,.35)}
.discord-msg{display:flex;gap:14px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.msg-author{font-weight:500;color:#fff;font-size:15px}
.msg-bot{background:var(--accent);color:#fff;font-size:10px;font-weight:600;padding:1px 4px;border-radius:3px;text-transform:uppercase}
.msg-time{font-size:12px;color:var(--faint)}
.msg-content{color:var(--text);font-size:15px;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;line-height:1.375}
.v2-container{background:#2b2d31;border-radius:4px;border-left:none;padding:16px;margin-top:2px;max-width:520px;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden}
.v2-container::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#1e1f22;border-radius:0}
.v2-container.has-accent::before{background:color-mix(in srgb,var(--accent) 82%,#000)}
.v2-container.has-accent{--accent-bar:var(--accent)}
.v2-container > :first-child{margin-top:0}
.v2-container > :last-child{margin-bottom:0}
.v2-text{color:#dbdee1;font-size:14px;white-space:pre-wrap;word-break:break-word;margin:0 0 8px;line-height:1.375}
.v2-text:last-child{margin-bottom:0}
.v2-text .h1{font-size:1.35em;font-weight:700;color:#fff;margin:0 0 6px;display:block;line-height:1.25}
.v2-text .h2{font-size:1.15em;font-weight:700;color:#fff;margin:0 0 4px;display:block}
.v2-text .h3{font-size:1.05em;font-weight:700;color:#fff;margin:0 0 4px;display:block}
.v2-text .sub{font-size:.85em;color:#949ba4;display:block;margin-bottom:2px}
.v2-text strong{font-weight:700}.v2-text em{font-style:italic}
.v2-text code{background:#1e1f22;padding:2px 5px;border-radius:4px;font-family:var(--mono);font-size:.88em}
.v2-text pre{background:#1e1f22;border-radius:6px;padding:12px 14px;overflow-x:auto;margin:8px 0;font-family:var(--mono);font-size:13px;line-height:1.5;border:1px solid #3f4147}
.v2-text pre code{background:none;padding:0}
.v2-text a{color:#00a8fc;text-decoration:none}
.v2-sep{height:1px;background:#3f4147;margin:10px 0;width:100%}
.v2-sep.large{margin:18px 0}
.v2-sep.noline{background:transparent;height:8px}
.v2-sep.large.noline{height:14px}
.v2-section{display:flex;gap:16px;align-items:flex-start;margin:0 0 8px}
.v2-section-text{flex:1;min-width:0}
.v2-thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#1e1f22;flex-shrink:0}
.v2-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;margin:8px 0;border-radius:6px;overflow:hidden}
.v2-gallery-item{aspect-ratio:16/10;background:#1e1f22;border-radius:4px;overflow:hidden}
.v2-gallery-item img,.v2-gallery-item video{width:100%;height:100%;object-fit:cover}
.v2-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.v2-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:3px;font-size:13px;font-weight:500;border:none;color:#fff;text-decoration:none;cursor:default;font-family:inherit;background:#4e5058}
.v2-btn-1{background:#5865f2}.v2-btn-2{background:#4e5058}.v2-btn-3{background:#248046}.v2-btn-4{background:#da373c}.v2-btn-5{background:#4e5058}
.v2-btn.disabled{opacity:.5}
.v2-select{background:#1e1f22;border:1px solid #4e5058;border-radius:4px;padding:10px 12px;color:#b5bac1;font-size:14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;max-width:100%}
.v2-select iconify-icon{font-size:16px;opacity:.6}
.json-panel{display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--glass-edge);background:rgba(12,12,14,.72);overflow:hidden;max-height:min(520px,calc(100vh - 180px));box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.json-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:rgba(0,0,0,.28);border-bottom:1px solid var(--glass-edge);flex-shrink:0}
.json-bar-name{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.json-copy{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;flex-shrink:0}
.json-copy:hover{background:rgba(255,255,255,.08);color:var(--text)}
.json-copy iconify-icon{font-size:14px}
.json-view{font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre;word-break:normal;padding:14px 16px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.json-key{color:#9cdcfe}.json-string{color:#ce9178}.json-number{color:#b5cea8}.json-bool,.json-null{color:#569cd6}
.confirm-actions{display:flex;gap:8px;margin-top:4px}
.confirm-actions .btn{flex:1}
.dl-input-wrap{margin-top:4px;margin-bottom:12px}
.dl-input-wrap label{margin-bottom:6px}
.dl-suffix{display:flex;align-items:center;gap:0;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.dl-suffix input{border:none;background:transparent;border-radius:0;flex:1}
.dl-suffix span{padding:9px 12px;color:var(--faint);font-size:13px;font-family:var(--mono);background:rgba(0,0,0,.25);border-left:1px solid var(--border);flex-shrink:0}
.toast-stack{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:12px 12px 0;padding-top:max(12px,env(safe-area-inset-top))}
.toast{pointer-events:auto;width:min(420px,100%);background:rgba(28,28,32,.72);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;animation:toastIn .35s cubic-bezier(.2,.8,.2,1);font-size:13px;font-weight:500}
.toast.ok{border-color:rgba(34,197,94,.35)}
.toast.err{border-color:rgba(242,63,67,.35)}
.toast > iconify-icon{font-size:22px;flex-shrink:0}
.toast.ok > iconify-icon{color:var(--green)}
.toast.err > iconify-icon{color:var(--red)}
.toast-body{flex:1;min-width:0;line-height:1.35;color:var(--text)}
.toast-close{background:rgba(255,255,255,.06);border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.toast-close:hover{color:var(--text);background:rgba(255,255,255,.1)}
.toast-close iconify-icon{font-size:16px;margin:0}
@keyframes toastIn{from{opacity:0;transform:translateY(-120%)}to{opacity:1;transform:translateY(0)}}
.mobile-bar{display:none;background:rgba(12,12,14,.45);backdrop-filter:blur(18px);border-top:1px solid var(--border);padding:10px 12px;gap:0;flex-shrink:0;z-index:90}
.mobile-bar-inner{display:flex;width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(12px)}
.mobile-bar .btn{flex:1;padding:12px 8px;font-size:12px;border:none;border-radius:0;border-right:1px solid var(--glass-edge);background:transparent}
.mobile-bar .btn:last-child{border-right:none}
.mobile-bar .btn-success{background:rgba(34,197,94,.9);color:#fff}
.mobile-bar .btn-success:hover{background:var(--green2)}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150}
.drawer-backdrop.open{display:block}
#jsonFileInput{display:none}
.gate{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,8,10,.72);backdrop-filter:blur(14px)}
.gate.hidden{display:none}
.gate-card{width:min(400px,100%);background:rgba(18,18,20,.9);border:1px solid var(--glass-edge);border-radius:18px;padding:24px;backdrop-filter:blur(22px);box-shadow:0 24px 64px rgba(0,0,0,.55)}
.gate-card .gate-icon{width:48px;height:48px;border-radius:14px;background:rgba(34,34,40,.8);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:#fff}
.gate-card .gate-icon iconify-icon{font-size:26px}
.gate-card h2{font-size:1.25rem;font-weight:800;color:#fff;margin-bottom:8px;letter-spacing:-.02em}
.gate-card p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:12px}
.gate-card a{color:#fff;text-decoration:underline;text-underline-offset:2px}
.gate-check{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--glass-edge);background:rgba(0,0,0,.2);margin:16px 0;cursor:pointer;user-select:none}
.gate-check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.gate-check span{font-size:13px;color:var(--muted);line-height:1.4}
.gate-actions{display:flex;flex-direction:column;gap:8px}
.gate-actions .btn{width:100%;padding:12px}
.gate-actions .btn:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:900px){
.send-bar{display:none}
.header-actions .btn[title="Preview"]{display:none}
.main{grid-template-columns:1fr}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);z-index:200;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.sidebar.open{transform:translateX(0)}
.preview-pane{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);z-index:200;transform:translateX(100%);transition:transform .22s ease;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.preview-pane.open{transform:translateX(0)}
.canvas{padding:14px 12px 80px}
.mobile-bar{display:flex}
.header-actions .btn span{display:none}
}
@media(max-width:480px){.field-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="gate" id="tosGate">
<div class="gate-card">
<div class="gate-icon"><iconify-icon icon="solar:shield-check-bold-duotone"></iconify-icon></div>

<p>You need to agree to the <a href="tos.html" target="_blank" rel="noopener">Terms of Service</a> before using the builder.</p>

<div class="app">
<header>
<button class="nav-toggle" onclick="toggleSidebar()"><iconify-icon icon="solar:hamburger-menu-bold-duotone"></iconify-icon></button>
<div class="logo">
<img src="https://raw.githubusercontent.com/t0x1c-dev/Proton-Services/main/images/proton-services-logo-backgroundtransparent.png" alt="Proton">
<span>Proton Services</span>
</div>
<div class="header-actions">
<button class="btn btn-ghost btn-sm" onclick="loadExample()" title="Example"><iconify-icon icon="solar:star-bold-duotone"></iconify-icon><span>Example</span></button>
<button class="btn btn-ghost btn-sm" onclick="downloadJSON()" title="Export"><iconify-icon icon="solar:export-bold-duotone"></iconify-icon><span>Export</span></button>
<button class="btn btn-ghost btn-sm" onclick="document.getElementById('jsonFileInput').click()" title="Import"><iconify-icon icon="solar:import-bold-duotone"></iconify-icon><span>Import</span></button>
<button class="btn btn-ghost btn-sm" onclick="togglePreview()" title="Preview"><iconify-icon icon="solar:eye-bold-duotone"></iconify-icon><span>Preview</span></button>

<input type="file" id="jsonFileInput" accept=".json,application/json" onchange="importJSON(this)">
<div class="drawer-backdrop" id="backdrop" onclick="closeDrawers()"></div>
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div>
<div class="modal" id="pickerModal" style="display:none"></div>
<div class="main">
<aside class="sidebar" id="sidebar">
<div class="sidebar-section">
<h3>Add component</h3>
<div class="palette">
<button class="palette-btn" onclick="addRoot('container');closeDrawers()"><iconify-icon icon="solar:widget-2-bold-duotone"></iconify-icon>Container</button>
<button class="palette-btn" onclick="addRoot('text');closeDrawers()"><iconify-icon icon="solar:text-bold-duotone"></iconify-icon>Text</button>
<button class="palette-btn" onclick="addRoot('section');closeDrawers()"><iconify-icon icon="solar:sidebar-minimalistic-bold-duotone"></iconify-icon>Section</button>
<button class="palette-btn" onclick="addRoot('separator');closeDrawers()"><iconify-icon icon="solar:minus-square-bold-duotone"></iconify-icon>Separator</button>
<button class="palette-btn" onclick="addRoot('media');closeDrawers()"><iconify-icon icon="solar:gallery-bold-duotone"></iconify-icon>Media</button>

<div class="field"><label>Webhook URL</label><input type="url" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..."></div>

</div>

<div class="mobile-bar-inner">
<button class="btn btn-ghost" onclick="toggleSidebar()"><iconify-icon icon="solar:hamburger-menu-bold-duotone"></iconify-icon></button>
<button class="btn btn-ghost" onclick="togglePreview()"><iconify-icon icon="solar:eye-bold-duotone"></iconify-icon></button>

</div>
</div>
</div>
<div class="toast-stack" id="toastStack"></div>
<script>
const L={container:'Container',text:'Text Display',section:'Section',separator:'Separator',media:'Media Gallery',buttons:'Action Row',select:'String Select',linkbtn:'Link Button'};
const IC={container:'solar:widget-2-bold-duotone',text:'solar:text-bold-duotone',section:'solar:sidebar-minimalistic-bold-duotone',separator:'solar:minus-square-bold-duotone',media:'solar:gallery-bold-duotone',buttons:'solar:slider-horizontal-bold-duotone',select:'solar:list-down-minimalistic-bold-duotone',linkbtn:'solar:link-bold-duotone'};
const STYLES=[{v:1,l:'Primary'},{v:2,l:'Secondary'},{v:3,l:'Success'},{v:4,l:'Danger'},{v:5,l:'Link'}];
const SPACING=[{v:1,l:'Small'},{v:2,l:'Large'}];
const ACC=[{v:'thumbnail',l:'Thumbnail'},{v:'button',l:'Link Button'}];
let components=[],nextId=1,activeTab='preview',cpTargetId=null,cpH=0,cpS=1,cpV=1;
function uid(){return nextId++}
function acceptTos(){try{localStorage.setItem('proton_tos_v1','1')}catch(e){}document.getElementById('tosGate').classList.add('hidden')}
(function(){try{if(localStorage.getItem('proton_tos_v1')==='1')document.getElementById('tosGate').classList.add('hidden')}catch(e){}})();
function toast(msg,type){type=type||'ok';const stack=document.getElementById('toastStack');const el=document.createElement('div');el.className='toast '+type;el.innerHTML=`<iconify-icon icon="${type==='err'?'solar:danger-bold-duotone':'solar:check-circle-bold-duotone'}"></iconify-icon><div class="toast-body">${esc(msg)}</div><button class="toast-close" aria-label="Close"><iconify-icon icon="lucide:x"></iconify-icon></button>`;el.querySelector('.toast-close').onclick=()=>el.remove();stack.appendChild(el);setTimeout(()=>{if(el.parentNode)el.remove()},4200)}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function md(t){if(!t)return'';let h=esc(t);h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre><code>'+c.trim()+'</code></pre>');h=h.replace(/^### (.*)$/gm,'<span class="h3">$1</span>');h=h.replace(/^## (.*)$/gm,'<span class="h2">$1</span>');h=h.replace(/^# (.*)$/gm,'<span class="h1">$1</span>');h=h.replace(/^-# (.*)$/gm,'<span class="sub">$1</span>');h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');h=h.replace(/\n/g,'<br>');return h}
function hsvToRgb(h,s,v){h/=60;const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break}return[Math.round(r*255),Math.round(g*255),Math.round(b*255)]}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;const s=max===0?0:d/max,v=max;if(d){switch(max){case r:h=((g-b)/d+(g<b?6:0));break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break}h*=60}return[h,s,v]}
function hexFromHsv(h,s,v){const[r,g,b]=hsvToRgb(h,s,v);return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function hsvFromHex(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return rgbToHsv((n>>16)&255,(n>>8)&255,n&255)}
function openModal(html){document.getElementById('modalBackdrop').classList.add('open');const m=document.getElementById('pickerModal');m.style.display='block';m.innerHTML=html}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('pickerModal').style.display='none';if(cpTargetId!=null){cpTargetId=null;render()}}
function openPicker(title,options,current,onSelect){const opts=options.map(o=>`<div class="modal-opt${o.v==current?' active':''}" onclick="(${onSelect})(${JSON.stringify(o.v)});closeModal()"><span>${esc(o.l)}</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></div>`).join('');openModal(`<h4>${esc(title)}</h4><div class="modal-options">${opts}</div><button class="btn btn-ghost modal-close" onclick="closeModal()">Cancel</button>`)}
function updateCpUI(){const hex=hexFromHsv(cpH,cpS,cpV);const[r,g,b]=hsvToRgb(cpH,1,1);const sv=document.getElementById('cpSv');if(!sv)return;sv.style.background=`rgb(${r},${g},${b})`;document.getElementById('cpSvCursor').style.left=(cpS*100)+'%';document.getElementById('cpSvCursor').style.top=((1-cpV)*100)+'%';document.getElementById('cpHueCursor').style.left=(cpH/360*100)+'%';document.getElementById('cpHueCursor').style.color=hexFromHsv(cpH,1,1);document.getElementById('cpPreview').style.background=hex;document.getElementById('cpHex').value=hex;if(cpTargetId!=null){const c=findById(cpTargetId);if(c){c.accent=parseInt(hex.slice(1),16);const sw=document.querySelector('[data-swatch="'+cpTargetId+'"]');if(sw)sw.style.background=hex;const inp=document.querySelector('[data-hex="'+cpTargetId+'"]');if(inp)inp.value=hex;refreshPreview()}}}
function openColorPicker(id,hex){cpTargetId=id;const hsv=hsvFromHex(hex||'#57F287');cpH=hsv[0];cpS=hsv[1];cpV=hsv[2];openModal(`<h4>Accent color</h4><p class="modal-desc">Drag the square and hue bar, or type a hex.</p><div class="cp-sv" id="cpSv"><div class="cp-sv-white"></div><div class="cp-sv-black"></div><div class="cp-sv-cursor" id="cpSvCursor"></div></div><div class="cp-hue" id="cpHue"><div class="cp-hue-cursor" id="cpHueCursor"></div></div><div class="cp-hex-row"><div class="cp-preview" id="cpPreview"></div><input type="text" id="cpHex" maxlength="7" onchange="applyHex(this.value)"></div><button class="btn btn-ghost modal-close" onclick="closeModal()">Done</button>`);updateCpUI();bindColorDrag()}
function applyHex(hex){if(!hex.startsWith('#'))hex='#'+hex;if(!/^#[0-9A-Fa-f]{6}$/.test(hex))return;const hsv=hsvFromHex(hex);cpH=hsv[0];cpS=hsv[1];cpV=hsv[2];updateCpUI()}
function bindColorDrag(){const sv=document.getElementById('cpSv'),hue=document.getElementById('cpHue');if(!sv||!hue)return;function svM(e){const r=sv.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;cpS=Math.max(0,Math.min(1,x/r.width));cpV=Math.max(0,Math.min(1,1-y/r.height));updateCpUI()}function hueM(e){const r=hue.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;cpH=Math.max(0,Math.min(360,x/r.width*360));updateCpUI()}let sd=false,hd=false;const up=()=>{sd=false;hd=false};sv.onmousedown=e=>{sd=true;svM(e)};hue.onmousedown=e=>{hd=true;hueM(e)};window.onmousemove=e=>{if(sd)svM(e);if(hd)hueM(e)};window.onmouseup=up;sv.ontouchstart=e=>{sd=true;svM(e)};hue.ontouchstart=e=>{hd=true;hueM(e)};window.ontouchmove=e=>{if(sd)svM(e);if(hd)hueM(e)};window.ontouchend=up}
function toggleSidebar(){const sb=document.getElementById('sidebar'),pv=document.getElementById('previewPane'),bd=document.getElementById('backdrop');pv.classList.remove('open');sb.classList.toggle('open');bd.classList.toggle('open',sb.classList.contains('open'))}
function togglePreview(){const sb=document.getElementById('sidebar'),pv=document.getElementById('previewPane'),bd=document.getElementById('backdrop');sb.classList.remove('open');pv.classList.toggle('open');bd.classList.toggle('open',pv.classList.contains('open'));refreshPreview()}
function closeDrawers(){document.getElementById('sidebar').classList.remove('open');document.getElementById('previewPane').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}
function makeComp(type){const id=uid();switch(type){case'container':return{id,type:'container',useAccent:true,accent:0x57F287,spoiler:false,children:[]};case'text':return{id,type:'text',content:''};case'section':return{id,type:'section',content:'',accessory:'thumbnail',thumb:'',btnLabel:'Open',btnUrl:'https://discord.com'};case'separator':return{id,type:'separator',divider:true,spacing:1};case'media':return{id,type:'media',items:[{url:'',isVideo:false}]};case'buttons':return{id,type:'buttons',buttons:[{label:'Button',style:5,url:'https://discord.com',custom_id:'',disabled:false}]};case'select':return{id,type:'select',placeholder:'Make a selection',custom_id:'select_'+id,min_values:1,max_values:1,options:[{label:'Option 1',value:'opt_1',description:''},{label:'Option 2',value:'opt_2',description:''}]};case'linkbtn':return{id,type:'linkbtn',label:'Open Link',url:'https://discord.com'};default:return null}}
function addRoot(type){const c=makeComp(type);if(c){components.push(c);render();refreshPreview()}}
function addChild(parentId,type){const p=findById(parentId);if(!p||p.type!=='container')return;if(type==='container'){toast('No nested containers','err');return}if(!p.children)p.children=[];p.children.push(makeComp(type));render();refreshPreview()}
function removeComp(id,parentId){if(parentId!=null){const p=findById(parentId);if(p&&p.children)p.children=p.children.filter(c=>c.id!==id)}else components=components.filter(c=>c.id!==id);render();refreshPreview()}
function moveComp(id,dir,parentId){const list=parentId!=null?(findById(parentId)||{}).children||[]:components;const idx=list.findIndex(c=>c.id===id);if(idx<0)return;const ni=idx+dir;if(ni<0||ni>=list.length)return;[list[idx],list[ni]]=[list[ni],list[idx]];render();refreshPreview()}
function findById(id,list){list=list||components;for(const c of list){if(c.id===id)return c;if(c.children){const f=findById(id,c.children);if(f)return f}}return null}
function setVal(id,key,value){const c=findById(id);if(c){c[key]=value;if(key==='useAccent'||key==='accessory'||key==='spacing'||key==='style')render();refreshPreview()}}
function setBtn(compId,btnIdx,key,value){const c=findById(compId);if(!c||!c.buttons)return;c.buttons[btnIdx][key]=value;if(key==='style')render();refreshPreview()}
function addBtn(compId){const c=findById(compId);if(!c)return;if(!c.buttons)c.buttons=[];c.buttons.push({label:'Button',style:2,custom_id:'btn_'+uid(),url:'',disabled:false});render();refreshPreview()}
function removeBtn(compId,idx){const c=findById(compId);if(!c||!c.buttons)return;c.buttons.splice(idx,1);render();refreshPreview()}
function addOpt(compId){const c=findById(compId);if(!c)return;if(!c.options)c.options=[];c.options.push({label:'Option',value:'opt_'+uid(),description:''});render();refreshPreview()}
function removeOpt(compId,idx){const c=findById(compId);if(!c||!c.options)return;c.options.splice(idx,1);render();refreshPreview()}
function setOpt(compId,idx,key,val){const c=findById(compId);if(c&&c.options&&c.options[idx]){c.options[idx][key]=val;refreshPreview()}}
function handleImageUpload(compId,input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Images only for upload','err');return}const reader=new FileReader();reader.onload=()=>{const c=findById(compId);if(!c)return;if(!c.items)c.items=[];const empty=c.items.findIndex(it=>!it.url);if(empty>=0)c.items[empty]={url:reader.result,isVideo:false};else c.items.push({url:reader.result,isVideo:false});render();refreshPreview();toast('Image added (preview)');input.value=''};reader.readAsDataURL(file)}
function updateMediaUrl(compId,idx,url){const c=findById(compId);if(c&&c.items&&c.items[idx]){c.items[idx].url=url;c.items[idx].isVideo=/\.(mp4|webm|mov)(\?|$)/i.test(url);refreshPreview()}}
function removeMediaItem(compId,idx){const c=findById(compId);if(c&&c.items){c.items.splice(idx,1);render();refreshPreview()}}
function pickLabel(options,value){const o=options.find(x=>x.v==value);return o?o.l:String(value)}
function renderComp(c,parentId,index,total){
const isChild=parentId!=null;
const head=`<div class="comp-head"><iconify-icon icon="${IC[c.type]||'solar:widget-2-bold-duotone'}"></iconify-icon><span class="comp-title">${L[c.type]||c.type}</span><div class="comp-actions"><button class="icon-btn" onclick="moveComp(${c.id},-1,${parentId})" ${index===0?'disabled':''}><iconify-icon icon="solar:alt-arrow-up-bold-duotone"></iconify-icon></button><button class="icon-btn" onclick="moveComp(${c.id},1,${parentId})" ${index===total-1?'disabled':''}><iconify-icon icon="solar:alt-arrow-down-bold-duotone"></iconify-icon></button><button class="icon-btn danger" onclick="removeComp(${c.id},${parentId})"><iconify-icon icon="solar:trash-bin-trash-bold-duotone"></iconify-icon></button></div></div>`;
let body='';
if(c.type==='container'){
const hex='#'+((c.accent!=null?c.accent:0x57F287)>>>0).toString(16).padStart(6,'0');
body=`<div class="toggle-row"><span>Accent color</span><label class="toggle"><input type="checkbox" ${c.useAccent?'checked':''} onchange="setVal(${c.id},'useAccent',this.checked)"><span class="toggle-slider"></span></label></div>`;
if(c.useAccent)body+=`<div class="field"><label>Color</label><div class="color-wrap"><div class="color-swatch" data-swatch="${c.id}" style="background:${hex}" onclick="openColorPicker(${c.id},'${hex}')"></div><input type="text" data-hex="${c.id}" value="${hex}" style="flex:1" onchange="applyHex(this.value);if(cpTargetId===${c.id})updateCpUI();else{const x=findById(${c.id});if(x){const n=parseInt(this.value.replace('#',''),16);if(!Number.isNaN(n)){x.accent=n;render();refreshPreview()}}}"></div></div>`;
body+=`<div class="toggle-row"><span>Spoiler</span><label class="toggle"><input type="checkbox" ${c.spoiler?'checked':''} onchange="setVal(${c.id},'spoiler',this.checked)"><span class="toggle-slider"></span></label></div>`;
body+=`<div><div class="children-label">Children</div><div class="children">${(c.children||[]).map((ch,i)=>renderComp(ch,c.id,i,c.children.length)).join('')||'<div style="color:var(--faint);font-size:12px;padding:12px">No children yet</div>'}</div><div class="add-child-bar"><button class="add-child-btn" onclick="addChild(${c.id},'text')"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Text</button><button class="add-child-btn" onclick="addChild(${c.id},'section')"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Section</button><button class="add-child-btn" onclick="addChild(${c.id},'separator')"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Separator</button><button class="add-child-btn" onclick="addChild(${c.id},'media')"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Media</button><button class="add-child-btn" onclick="addChild(${c.id},'buttons')"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Buttons</button><button class="add-child-btn" onclick="addChild(${c.id},'select')"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Dropdown</button><button class="add-child-btn" onclick="addChild(${c.id},'linkbtn')"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Link</button></div></div>`;
}
if(c.type==='text')body=`<div class="field"><label>Content (markdown)</label><textarea oninput="setVal(${c.id},'content',this.value)">${esc(c.content)}</textarea></div>`;
if(c.type==='section'){
body=`<div class="field"><label>Text content</label><textarea oninput="setVal(${c.id},'content',this.value)">${esc(c.content)}</textarea></div><div class="field"><label>Accessory</label><button type="button" class="pick-btn" onclick="openPicker('Accessory',ACC,'${c.accessory}',function(v){setVal(${c.id},'accessory',v);render();refreshPreview()})"><span>${esc(pickLabel(ACC,c.accessory))}</span><iconify-icon icon="solar:alt-arrow-down-bold-duotone"></iconify-icon></button></div>`;
if(c.accessory==='thumbnail')body+=`<div class="field"><label>Thumbnail URL</label><input type="url" value="${esc(c.thumb||'')}" oninput="setVal(${c.id},'thumb',this.value)"></div>`;
else body+=`<div class="field-row"><div class="field"><label>Button label</label><input type="text" value="${esc(c.btnLabel||'')}" oninput="setVal(${c.id},'btnLabel',this.value)"></div><div class="field"><label>Button URL</label><input type="url" value="${esc(c.btnUrl||'')}" oninput="setVal(${c.id},'btnUrl',this.value)"></div></div>`;
}
if(c.type==='separator')body=`<div class="field-row"><div class="field"><label>Spacing</label><button type="button" class="pick-btn" onclick="openPicker('Spacing',SPACING,${c.spacing},function(v){setVal(${c.id},'spacing',+v)})"><span>${esc(pickLabel(SPACING,c.spacing))}</span><iconify-icon icon="solar:alt-arrow-down-bold-duotone"></iconify-icon></button></div><div class="field" style="justify-content:flex-end"><label>&nbsp;</label><div class="toggle-row"><span>Divider</span><label class="toggle"><input type="checkbox" ${c.divider?'checked':''} onchange="setVal(${c.id},'divider',this.checked)"><span class="toggle-slider"></span></label></div></div></div>`;
if(c.type==='media'){const items=(c.items||[]).map((it,i)=>`<div class="opt-card"><div class="field"><label>Image / video URL</label><input type="url" value="${esc(it.url&&!String(it.url).startsWith('data:')?it.url:'')}" placeholder="https://..." oninput="updateMediaUrl(${c.id},${i},this.value)"></div><div class="media-row" style="margin-top:8px"><label class="file-btn"><iconify-icon icon="solar:upload-bold-duotone"></iconify-icon> Upload<input type="file" accept="image/*" onchange="handleImageUpload(${c.id},this)"></label><button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="removeMediaItem(${c.id},${i})">Remove</button></div>${it.url&&String(it.url).startsWith('data:')?'<p style="font-size:11px;color:var(--faint);margin-top:4px">Local image (preview only)</p>':''}</div>`).join('');body=`${items}<button class="btn btn-ghost btn-sm" onclick="const c=findById(${c.id});if(c){if(!c.items)c.items=[];c.items.push({url:'',isVideo:false});render();refreshPreview()}"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Add media</button><p style="font-size:11px;color:var(--faint);margin-top:6px">Upload for preview. Public URLs to send.</p>`}
if(c.type==='buttons'){body=(c.buttons||[]).map((b,i)=>`<div class="opt-card"><div class="field-row"><div class="field"><label>Label</label><input type="text" value="${esc(b.label)}" oninput="setBtn(${c.id},${i},'label',this.value)"></div><div class="field"><label>Style</label><button type="button" class="pick-btn" onclick="openPicker('Button style',STYLES,${b.style},function(v){setBtn(${c.id},${i},'style',+v)})"><span>${esc(pickLabel(STYLES,b.style))}</span><iconify-icon icon="solar:alt-arrow-down-bold-duotone"></iconify-icon></button></div></div><div class="field" style="margin-top:8px"><label>${b.style===5?'URL':'Custom ID'}</label><input type="text" value="${esc(b.style===5?b.url:b.custom_id)}" oninput="setBtn(${c.id},${i},'${b.style===5?'url':'custom_id'}',this.value)"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div class="toggle-row"><span>Disabled</span><label class="toggle"><input type="checkbox" ${b.disabled?'checked':''} onchange="setBtn(${c.id},${i},'disabled',this.checked)"><span class="toggle-slider"></span></label></div><button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="removeBtn(${c.id},${i})">Remove</button></div></div>`).join('')+`<button class="btn btn-ghost btn-sm" onclick="addBtn(${c.id})"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Add button</button><p style="font-size:11px;color:var(--faint);margin-top:4px">Link buttons work with webhooks.</p>`}
if(c.type==='select'){const opts=(c.options||[]).map((o,i)=>`<div class="opt-card"><div class="field"><label>Label</label><input type="text" value="${esc(o.label)}" oninput="setOpt(${c.id},${i},'label',this.value)"></div><div class="field" style="margin-top:8px"><label>Value</label><input type="text" value="${esc(o.value)}" oninput="setOpt(${c.id},${i},'value',this.value)"></div><div class="field" style="margin-top:8px"><label>Description</label><input type="text" value="${esc(o.description||'')}" oninput="setOpt(${c.id},${i},'description',this.value)"></div><button class="btn btn-ghost btn-sm" style="color:var(--red);margin-top:8px" onclick="removeOpt(${c.id},${i})">Remove</button></div>`).join('');body=`<div class="field"><label>Placeholder</label><input type="text" value="${esc(c.placeholder||'')}" oninput="setVal(${c.id},'placeholder',this.value)"></div><div class="field"><label>Custom ID</label><input type="text" value="${esc(c.custom_id||'')}" oninput="setVal(${c.id},'custom_id',this.value)"></div><div class="field-row"><div class="field"><label>Min values</label><input type="text" value="${c.min_values||1}" oninput="setVal(${c.id},'min_values',+this.value||1)"></div><div class="field"><label>Max values</label><input type="text" value="${c.max_values||1}" oninput="setVal(${c.id},'max_values',+this.value||1)"></div></div><div class="children-label" style="margin-top:4px">Options</div>${opts}<button class="btn btn-ghost btn-sm" onclick="addOpt(${c.id})"><iconify-icon icon="solar:add-circle-bold-duotone"></iconify-icon> Add option</button><p style="font-size:11px;color:var(--faint);margin-top:6px">Selects need a bot for interactions. JSON export still works.</p>`}
if(c.type==='linkbtn')body=`<div class="field"><label>Label</label><input type="text" value="${esc(c.label||'')}" oninput="setVal(${c.id},'label',this.value)"></div><div class="field"><label>URL</label><input type="url" value="${esc(c.url||'')}" oninput="setVal(${c.id},'url',this.value)"></div>`;
return`<div class="${isChild?'child-comp':'comp'}">${head}<div class="comp-body">${body}</div></div>`;
}
function countAll(list){let n=0;for(const c of list){n++;if(c.children)n+=countAll(c.children)}return n}
function render(){const list=document.getElementById('compList');const count=countAll(components);document.getElementById('compCount').textContent=count+' component'+(count!==1?'s':'');if(!components.length){list.className='';list.innerHTML='<div class="empty-state"><iconify-icon icon="solar:widget-2-bold-duotone"></iconify-icon><p>Add components from the left to start.</p></div>';return}list.className='comp-list';list.innerHTML=components.map((c,i)=>renderComp(c,null,i,components.length)).join('')}
function toApi(c){
if(c.type==='container')return{type:17,accent_color:c.useAccent?(c.accent!=null?c.accent:0x57F287):null,spoiler:!!c.spoiler,components:(c.children||[]).map(toApi)};
if(c.type==='text')return{type:10,content:c.content||''};
if(c.type==='section'){const s={type:9,components:[{type:10,content:c.content||''}]};if(c.accessory==='thumbnail'&&c.thumb)s.accessory={type:11,media:{url:c.thumb}};else if(c.accessory==='button')s.accessory={type:2,style:5,label:c.btnLabel||'Open',url:c.btnUrl||'https://discord.com'};return s}
if(c.type==='separator')return{type:14,divider:!!c.divider,spacing:c.spacing||1};
if(c.type==='media')return{type:12,items:(c.items||[]).filter(it=>it.url&&!String(it.url).startsWith('data:')).map(it=>({media:{url:it.url},description:null,spoiler:false}))};
if(c.type==='buttons')return{type:1,components:(c.buttons||[]).map(b=>{const btn={type:2,style:b.style||2,label:b.label||'Button',disabled:!!b.disabled};if(b.style===5)btn.url=b.url||'https://discord.com';else btn.custom_id=b.custom_id||('id_'+Math.random().toString(36).slice(2,9));return btn})};
if(c.type==='select')return{type:1,components:[{type:3,custom_id:c.custom_id||('select_'+c.id),placeholder:c.placeholder||'Make a selection',min_values:c.min_values||1,max_values:c.max_values||1,options:(c.options||[]).filter(o=>o.label).map(o=>{const opt={label:o.label,value:o.value||o.label};if(o.description)opt.description=o.description;return opt})}]};
if(c.type==='linkbtn')return{type:1,components:[{type:2,style:5,label:c.label||'Open Link',url:c.url||'https://discord.com'}]};
return null;
}
function buildPayload(){const payload={flags:32768,components:components.map(toApi).filter(Boolean)};const content=document.getElementById('msgContent').value.trim();if(content)payload.content=content;const u=document.getElementById('username').value.trim();const a=document.getElementById('avatarUrl').value.trim();if(u)payload.username=u;if(a)payload.avatar_url=a;return payload}
function fromApi(comp){
if(!comp||!comp.type)return null;
if(comp.type===17)return{id:uid(),type:'container',useAccent:comp.accent_color!=null,accent:comp.accent_color!=null?comp.accent_color:0x5865f2,spoiler:!!comp.spoiler,children:(comp.components||[]).map(fromApi).filter(Boolean)};
if(comp.type===10)return{id:uid(),type:'text',content:comp.content||''};
if(comp.type===9){const texts=(comp.components||[]).filter(x=>x.type===10).map(x=>x.content).join('\n');const s={id:uid(),type:'section',content:texts||'',accessory:'thumbnail',thumb:'',btnLabel:'Open',btnUrl:'https://discord.com'};if(comp.accessory){if(comp.accessory.type===11){s.accessory='thumbnail';s.thumb=comp.accessory.media?.url||''}else if(comp.accessory.type===2){s.accessory='button';s.btnLabel=comp.accessory.label||'Open';s.btnUrl=comp.accessory.url||''}}return s}
if(comp.type===14)return{id:uid(),type:'separator',divider:comp.divider!==false,spacing:comp.spacing||1};
if(comp.type===12)return{id:uid(),type:'media',items:(comp.items||[]).map(it=>({url:it.media?.url||'',isVideo:false}))};
if(comp.type===1){const kids=comp.components||[];if(kids.some(k=>k.type===3)){const sel=kids.find(k=>k.type===3);return{id:uid(),type:'select',placeholder:sel.placeholder||'',custom_id:sel.custom_id||'',min_values:sel.min_values||1,max_values:sel.max_values||1,options:(sel.options||[]).map(o=>({label:o.label||'',value:o.value||'',description:o.description||''}))}}const btns=kids.filter(b=>b.type===2);if(btns.length===1&&btns[0].style===5)return{id:uid(),type:'linkbtn',label:btns[0].label||'Open Link',url:btns[0].url||''};return{id:uid(),type:'buttons',buttons:btns.map(b=>({label:b.label||'Button',style:b.style||2,url:b.url||'',custom_id:b.custom_id||'',disabled:!!b.disabled}))}}
return null;
}
function importJSON(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);let comps=data.components||(Array.isArray(data)?data:null);if(!comps){toast('Invalid JSON structure','err');return}components=comps.map(fromApi).filter(Boolean);if(data.content)document.getElementById('msgContent').value=data.content;if(data.username)document.getElementById('username').value=data.username;if(data.avatar_url)document.getElementById('avatarUrl').value=data.avatar_url;render();refreshPreview();toast('JSON imported')}catch(e){toast('Failed to parse JSON','err')}input.value=''};reader.readAsText(file)}
function downloadJSON(){openModal(`<h4>Export JSON</h4><p class="modal-desc">Name the file. .json is added for you.</p><div class="dl-input-wrap"><label>File name</label><div class="dl-suffix"><input type="text" id="dlName" value="components-v2" maxlength="80" autocomplete="off"><span>.json</span></div></div><div class="confirm-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-success" onclick="doDownloadJSON()">Download</button></div>`);setTimeout(()=>{const i=document.getElementById('dlName');if(i){i.focus();i.select()}},50)}
function doDownloadJSON(){let name=(document.getElementById('dlName')?.value||'components-v2').trim()||'components-v2';name=name.replace(/\.json$/i,'').replace(/[^a-zA-Z0-9._\- ]+/g,'').trim()||'components-v2';const blob=new Blob([JSON.stringify(buildPayload(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.json';a.click();URL.revokeObjectURL(a.href);closeModal();toast('Downloaded '+name+'.json')}
function copyJSON(){const raw=window.__lastJSON||JSON.stringify(buildPayload(),null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(raw).then(()=>toast('Copied JSON')).catch(()=>fallbackCopyJSON(raw))}else fallbackCopyJSON(raw)}
function fallbackCopyJSON(raw){const ta=document.createElement('textarea');ta.value=raw;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied JSON')}catch(e){toast('Copy failed','err')}document.body.removeChild(ta)}
function switchTab(tab){activeTab=tab;document.querySelectorAll('.preview-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));refreshPreview()}
function syntaxHighlight(json){return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,m=>{let cls='json-number';if(/^"/.test(m))cls=/:$/.test(m)?'json-key':'json-string';else if(/true|false/.test(m))cls='json-bool';else if(/null/.test(m))cls='json-null';return`<span class="${cls}">${m}</span>`})}
function renderPreviewComp(comp){
if(comp.type===17){const color=comp.accent_color!=null&&comp.accent_color!==''?'#'+(Number(comp.accent_color)>>>0).toString(16).padStart(6,'0'):null;const inner=(comp.components||[]).map(renderPreviewComp).join('');return`<div class="v2-container ${color?'has-accent':''}" style="${color?'--accent:'+color:''}">${inner}</div>`}
if(comp.type===10)return`<div class="v2-text">${md(comp.content)}</div>`;
if(comp.type===9){const text=(comp.components||[]).map(c=>c.type===10?`<div class="v2-text">${md(c.content)}</div>`:'').join('');let acc='';if(comp.accessory){if(comp.accessory.type===11&&comp.accessory.media?.url)acc=`<img class="v2-thumb" src="${esc(comp.accessory.media.url)}" alt="" onerror="this.style.opacity=.3">`;else if(comp.accessory.type===2)acc=`<a class="v2-btn v2-btn-5" href="${esc(comp.accessory.url||'#')}" target="_blank">${esc(comp.accessory.label||'Button')}</a>`}return`<div class="v2-section"><div class="v2-section-text">${text}</div>${acc}</div>`}
if(comp.type===14){const cls=['v2-sep',comp.spacing===2?'large':'',!comp.divider?'noline':''].filter(Boolean).join(' ');return`<div class="${cls}"></div>`}
if(comp.type===12){const items=(comp.items||[]).map(it=>{const u=it.media?.url||'';const isVid=/\.(mp4|webm|mov)(\?|$)/i.test(u);return`<div class="v2-gallery-item">${isVid?`<video src="${esc(u)}" muted playsinline></video>`:`<img src="${esc(u)}" alt="" onerror="this.parentElement.style.display='none'">`}</div>`}).join('');return`<div class="v2-gallery">${items}</div>`}
if(comp.type===1){const kids=comp.components||[];const sel=kids.find(k=>k.type===3);if(sel)return`<div class="v2-select"><span>${esc(sel.placeholder||'Make a selection')}</span><iconify-icon icon="solar:alt-arrow-down-bold-duotone"></iconify-icon></div>`;const btns=kids.filter(b=>b.type===2).map(b=>{const cls=`v2-btn v2-btn-${b.style||2}${b.disabled?' disabled':''}`;if(b.style===5)return`<a class="${cls}" href="${esc(b.url||'#')}" target="_blank">${esc(b.label)}</a>`;return`<button class="${cls}" disabled>${esc(b.label)}</button>`}).join('');return`<div class="v2-row">${btns}</div>`}
return'';
}
function refreshPreview(){const body=document.getElementById('previewBody');const payload=buildPayload();if(activeTab==='json'){const raw=JSON.stringify(payload,null,2);body.innerHTML=`<div class="json-panel"><div class="json-bar"><span class="json-bar-name">components-v2.json</span><button type="button" class="json-copy" onclick="copyJSON()"><iconify-icon icon="solar:copy-bold-duotone"></iconify-icon>Copy</button></div><div class="json-view" id="jsonView">${syntaxHighlight(esc(raw))}</div></div>`;window.__lastJSON=raw;return}const uname=document.getElementById('username').value.trim()||'Webhook';const avatar=document.getElementById('avatarUrl').value.trim();const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const msgContent=document.getElementById('msgContent').value.trim();let content='';if(msgContent)content+=`<div class="msg-content">${md(msgContent)}</div>`;content+=!payload.components.length&&!msgContent?'<div style="color:var(--faint);padding:24px 0;text-align:center;font-size:13px">Nothing to preview yet</div>':payload.components.map(renderPreviewComp).join('');body.innerHTML=`<div class="discord-msg"><div class="avatar">${avatar?`<img src="${esc(avatar)}" onerror="this.parentElement.textContent='${esc(uname[0]||'W')}'">`:esc(uname[0]||'W')}</div><div class="msg-body"><div class="msg-meta"><span class="msg-author">${esc(uname)}</span><span class="msg-bot">APP</span><span class="msg-time">Today at ${time}</span></div>${content}</div></div>`}
async function sendWebhook(){let url=document.getElementById('webhookUrl').value.trim();if(!url){toast('Paste a webhook URL first','err');return}if(!url.includes('with_components'))url+=(url.includes('?')?'&':'?')+'with_components=true';const payload=buildPayload();if(!payload.components.length&&!payload.content){toast('Add at least one component or message content','err');return}const btn=document.getElementById('sendBtn');btn.disabled=true;btn.textContent='Sending…';try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(res.ok||res.status===204)toast('Message sent');else{const t=await res.text();toast('Error '+res.status+': '+t.slice(0,90),'err')}}catch(e){toast('Network error: '+e.message,'err')}finally{btn.disabled=false;btn.innerHTML='<iconify-icon icon="solar:plain-2-bold-duotone"></iconify-icon> Send message'}}
function clearAll(){if(!components.length&&!document.getElementById('msgContent').value.trim())return;openModal(`<h4>Clear everything?</h4><p class="modal-desc">This removes all components and message content. Cannot undo.</p><div class="confirm-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="doClearAll()">Clear</button></div>`)}
function doClearAll(){components=[];document.getElementById('msgContent').value='';closeModal();render();refreshPreview();toast('Cleared')}
function loadExample(){components=[{id:uid(),type:'container',useAccent:true,accent:0x57F287,spoiler:false,children:[{id:uid(),type:'text',content:'## Deployment complete\nService: api-gateway · Version: v2.4.1\nEnvironment: Production'},{id:uid(),type:'separator',divider:true,spacing:1},{id:uid(),type:'section',content:'All health checks passed. Ready for traffic.',accessory:'thumbnail',thumb:'https://cdn.discordapp.com/embed/avatars/0.png',btnLabel:'Open',btnUrl:'https://discord.com'},{id:uid(),type:'select',placeholder:'Choose environment',custom_id:'env_select',min_values:1,max_values:1,options:[{label:'Production',value:'prod',description:'Live servers'},{label:'Staging',value:'staging',description:'Pre-prod'},{label:'Development',value:'dev',description:'Local testing'}]},{id:uid(),type:'buttons',buttons:[{label:'Dashboard',style:5,url:'https://discord.com',custom_id:'',disabled:false},{label:'Logs',style:5,url:'https://github.com',custom_id:'',disabled:false}]}]}];document.getElementById('msgContent').value='';render();refreshPreview();toast('Example loaded');closeDrawers()}
render();refreshPreview();
</script>
