<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credits | Proton Services</title>

<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
:root{--bg:#0c0c0e;--border:rgba(42,42,50,.7);--border2:#3a3a44;--text:#f4f4f5;--muted:#a1a1aa;--faint:#71717a;--glass:rgba(18,18,20,.42);--glass-edge:rgba(255,255,255,.08);--font:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;position:relative;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background:url('https://i.imgur.com/UUw90rV.gif') center center / cover no-repeat;opacity:.65;z-index:0;pointer-events:none}
body.quality-stable::before{opacity:.35}
body > *{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
iconify-icon{display:inline-block;vertical-align:middle}
nav{position:sticky;top:0;z-index:50;background:rgba(12,12,14,.72);backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid var(--glass-edge);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
body.quality-stable nav{backdrop-filter:none;background:rgba(12,12,14,.92)}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;min-width:0}
.nav-brand img{width:24px;height:24px;object-fit:contain;flex-shrink:0}
.nav-brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:6px;align-items:center;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:12px;border:none;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn iconify-icon{font-size:17px}
.btn-white{background:#fff;color:#0c0c0e}
.btn-white:hover{background:#e4e4e7}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid transparent;padding:9px 10px}
.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border2)}
.btn-outline:hover{border-color:var(--muted);background:rgba(255,255,255,.04)}
.icon-pill{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--glass-edge);color:var(--muted);transition:background .15s,color .15s}
.icon-pill:hover{background:rgba(255,255,255,.1);color:var(--text)}
.icon-pill iconify-icon{font-size:18px}
.wrap{max-width:720px;margin:0 auto;padding:36px 16px 56px;width:100%;flex:1}
.page-head{margin-bottom:22px}
.page-head .icon-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.page-head .icon-box{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--glass-edge);display:flex;align-items:center;justify-content:center;color:#fff}
.page-head .icon-box iconify-icon{font-size:24px}
.page-head h1{font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:8px}
.page-head p{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:0;border-radius:18px;overflow:hidden;border:1px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);box-shadow:0 8px 40px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04)}
body.quality-stable .stack{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(22,22,26,.92)}
.person{padding:22px;border-bottom:1px solid var(--glass-edge);display:flex;flex-direction:column;gap:14px}
.person:last-child{border-bottom:none}
.person-top{display:flex;align-items:flex-start;gap:14px}
.avatar{width:64px;height:64px;border-radius:16px;object-fit:cover;border:1px solid var(--glass-edge);background:rgba(0,0,0,.3);flex-shrink:0}
.person-info{min-width:0;flex:1}
.person-info h2{font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.3}
.role{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--glass-edge);margin-bottom:8px}
.role iconify-icon{font-size:13px}
.desc{font-size:14px;color:var(--muted);line-height:1.55;min-height:1.2em}
.desc:empty{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1;min-width:120px}
footer{border-top:1px solid var(--glass-edge);padding:24px 16px;text-align:center;background:rgba(12,12,14,.65);backdrop-filter:blur(14px);margin-top:auto;flex-shrink:0;width:100%}
body.quality-stable footer{backdrop-filter:none;background:rgba(12,12,14,.92)}
.footer-brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.footer-brand img{width:20px;height:20px;object-fit:contain}
.footer-brand strong{font-size:13px;color:var(--muted)}
.footer-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.footer-links a{font-size:13px;color:var(--faint)}
.footer-links a:hover{color:var(--text)}
.footer-copy{font-size:11px;color:var(--faint)}
@media(min-width:640px){
nav{padding:0 24px;height:56px}
.nav-brand{font-size:16px}
.nav-brand img{width:26px;height:26px}
.btn{padding:10px 16px;font-size:14px}
.wrap{padding:44px 24px 72px}
.page-head h1{font-size:1.9rem}
.person{padding:26px}
.avatar{width:72px;height:72px;border-radius:18px}
.actions .btn{flex:0 1 auto}
}
@media(max-width:639px){
.nav-links .btn-ghost span{display:none}
}
</style>
</head>

function getLang(){try{const l=localStorage.getItem('proton_lang');if(l&&I18N[l])return l}catch(e){}return'en'}
function getQuality(){try{const q=localStorage.getItem('proton_quality');if(q==='stable'||q==='good')return q}catch(e){}return'good'}
function applyQuality(){document.body.classList.toggle('quality-stable',getQuality()==='stable')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
const lang=getLang();

document.documentElement.lang=lang==='pt'?'pt-BR':lang==='es'?'es-ES':lang;
document.title=t.title+' | Proton Services';
document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k])el.textContent=t[k]});
